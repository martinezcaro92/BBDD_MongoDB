services:
  mongo:
    image: docker.io/library/mongo:7
    container_name: mongo_server
    restart: unless-stopped
    env_file: .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - TZ=Europe/Madrid
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    # If you're on Windows ARM and face issues, uncomment to force emulation
    # platform: linux/amd64

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: unless-stopped
    env_file: .env
    environment:
      # Usa la URL completa con authSource=admin y contraseña codificada
      ME_CONFIG_MONGODB_URL: "mongodb://root:Str0ngP%40ssw0rd%212025@mongo:27017/?authSource=admin"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    depends_on:
      mongo:
        condition: service_healthy   # espera a que Mongo esté “healthy”


volumes:
  mongo_data:
